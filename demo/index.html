<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keepwatch demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 32px auto; padding: 0 16px; color: #111; }
    keep-watch { --kw-accent: #2f6bff; box-shadow: 0 20px 60px -20px rgba(0,0,0,.4); }
    #book { margin-top: 32px; padding: 24px; border-radius: 16px; background: #eef3ff; }
    #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 8px; max-height: 200px; overflow: auto; }
  </style>
  <script src="../dist/keepwatch.js" defer></script>
</head>
<body>
  <h1>Keepwatch demo</h1>
  <p>Muted autoplay, click for sound, fast bar, resume on reload, CTA at 0:08 (demo value).</p>

  <keep-watch
    src="https://vimeo.com/1226915932"
    video="clark-vsl-demo"
    cta-at="0:08"
    cta-href="#book"
    label="Clark VSL"
  ></keep-watch>

  <section id="book" data-keepwatch-gate>
    <h2>Book your call</h2>
    <p>This section is hidden until the video reaches the CTA time.</p>
  </section>

  <h3>Events</h3>
  <div id="log"></div>
  <script>
    for (const name of ["ready", "play", "unmute", "pause", "cta-shown", "cta-click", "ended", "error"]) {
      document.addEventListener("keepwatch:" + name, (e) => {
        document.getElementById("log").textContent += `${new Date().toLocaleTimeString()} ${name} ${JSON.stringify(e.detail)}\n`;
      });
    }
  </script>
</body>
</html>
